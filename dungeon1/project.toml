# Right wall
[[pieces]]
asset    = "wall_corner"
position = [5.0, 0.0, -3.0]
rotation = 270.0
scale    = 1.0

[[pieces]]
asset    = "wall_gated"
position = [5.0, 0.0, -1.0]
rotation = 270.0
scale    = 1.0

[[pieces]]
asset    = "wall_window_closed"
position = [5.0, 0.0, 1.0]
rotation = 270.0
scale    = 1.0

# Front wall with doorway
[[pieces]]
asset    = "wall"
position = [-3.0, 0.0, 3.0]
rotation = 180.0
scale    = 1.0

[[pieces]]
asset    = "wall_doorway"
position = [-1.0, 0.0, 3.0]
rotation = 180.0
scale    = 1.0

[[pieces]]
asset    = "wall"
position = [1.0, 0.0, 3.0]
rotation = 180.0
scale    = 1.0

[[pieces]]
asset    = "wall"
position = [3.0, 0.0, 3.0]
rotation = 180.0
