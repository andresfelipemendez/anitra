# Gym test scene — 8 characters in a 2×4 grid, all animated and controlled.
# Launch with: build.bat play_test

[project]
name = "Gym Scene"
version = 2
autoplay = true

[assets.models]
knight    = "game_assets/KayKit_Adventurers_2.0_FREE/Characters/gltf/Knight.glb"
barbarian = "game_assets/KayKit_Adventurers_2.0_FREE/Characters/gltf/Barbarian.glb"
mage      = "game_assets/KayKit_Adventurers_2.0_FREE/Characters/gltf/Mage.glb"
rogue     = "game_assets/KayKit_Adventurers_2.0_FREE/Characters/gltf/Rogue.glb"

[assets.animations]
general  = "game_assets/KayKit_Adventurers_2.0_FREE/Animations/gltf/Rig_Medium/Rig_Medium_General.glb"
movement = "game_assets/KayKit_Adventurers_2.0_FREE/Animations/gltf/Rig_Medium/Rig_Medium_MovementBasic.glb"

[camera]
eye    = [0.0, 12.0, 16.0]
target = [0.0,  0.0,  1.5]
up     = [0.0,  1.0,  0.0]
fov    = 45.0

[lighting]
ambient = [0.2000, 0.1800, 0.2500]

[[lighting.point_lights]]
position  = [0.0, 5.0, 0.0]
color     = [1.0, 0.92, 0.80]
intensity = 12.0
radius    = 20.0

[[lighting.point_lights]]
position  = [-6.0, 4.0, -6.0]
color     = [0.60, 0.75, 1.00]
intensity = 5.0
radius    = 12.0

[[lighting.point_lights]]
position  = [6.0, 4.0, 6.0]
color     = [1.0, 0.65, 0.40]
intensity = 5.0
radius    = 12.0

# ── Entity index map ───────────────────────────────────────────────────────
#  0  camera
#  1  player       ← receives WASD input
#  2  agent_1
#  3  agent_2
#  4  agent_3
#  5  agent_4
#  6  agent_5
#  7  agent_6
#  8  agent_7
#  9  player_mesh  ← skinned mesh child of entity 1
#  10 agent_1_mesh
#  11 agent_2_mesh
#  12 agent_3_mesh
#  13 agent_4_mesh
#  14 agent_5_mesh
#  15 agent_6_mesh
#  16 agent_7_mesh
#  17 floor        ← invisible box collider, keeps characters on the ground
#  18-25 zone_1..8 ← trigger zones 5 m ahead of each character controller

[entities]
list = [
  "camera",
  "player",
  "agent_1",
  "agent_2",
  "agent_3",
  "agent_4",
  "agent_5",
  "agent_6",
  "agent_7",
  "player_mesh",
  "agent_1_mesh",
  "agent_2_mesh",
  "agent_3_mesh",
  "agent_4_mesh",
  "agent_5_mesh",
  "agent_6_mesh",
  "agent_7_mesh",
  "floor",
  "zone_1",
  "zone_2",
  "zone_3",
  "zone_4",
  "zone_5",
  "zone_6",
  "zone_7",
  "zone_8"
]

# ── Transforms ─────────────────────────────────────────────────────────────
# Grid: 2 rows × 4 cols, 3 m spacing
#   Row 0 (z=0): x = -4.5, -1.5, 1.5, 4.5  →  entities 1-4
#   Row 1 (z=3): x = -4.5, -1.5, 1.5, 4.5  →  entities 5-8

[transforms]
"0"  = { position = [0.0000, 10.0000, 14.0000] }   # camera
"1"  = { position = [-4.5000, 0.0000,  0.0000] }
"2"  = { position = [-1.5000, 0.0000,  0.0000] }
"3"  = { position = [ 1.5000, 0.0000,  0.0000] }
"4"  = { position = [ 4.5000, 0.0000,  0.0000] }
"5"  = { position = [-4.5000, 0.0000,  3.0000] }
"6"  = { position = [-1.5000, 0.0000,  3.0000] }
"7"  = { position = [ 1.5000, 0.0000,  3.0000] }
"8"  = { position = [ 4.5000, 0.0000,  3.0000] }
# Mesh children — Y offset aligns model origin to ground plane
"9"  = { position = [0.0000, -0.8563, 0.0000] }
"10" = { position = [0.0000, -0.8563, 0.0000] }
"11" = { position = [0.0000, -0.8563, 0.0000] }
"12" = { position = [0.0000, -0.8563, 0.0000] }
"13" = { position = [0.0000, -0.8563, 0.0000] }
"14" = { position = [0.0000, -0.8563, 0.0000] }
"15" = { position = [0.0000, -0.8563, 0.0000] }
"16" = { position = [0.0000, -0.8563, 0.0000] }
# Floor plane — top face at y=0
"17" = { position = [0.0000, -1.2000, 1.5000] }
# Trigger zones — 5 m ahead (+Z) of each character controller start
"18" = { position = [-4.5000, 0.0000,  5.0000] }
"19" = { position = [-1.5000, 0.0000,  5.0000] }
"20" = { position = [ 1.5000, 0.0000,  5.0000] }
"21" = { position = [ 4.5000, 0.0000,  5.0000] }
"22" = { position = [-4.5000, 0.0000,  8.0000] }
"23" = { position = [-1.5000, 0.0000,  8.0000] }
"24" = { position = [ 1.5000, 0.0000,  8.0000] }
"25" = { position = [ 4.5000, 0.0000,  8.0000] }

[rotations]
"1" = { y = 0.0 }
"2" = { y = 0.0 }
"3" = { y = 0.0 }
"4" = { y = 0.0 }
"5" = { y = 0.0 }
"6" = { y = 0.0 }
"7" = { y = 0.0 }
"8" = { y = 0.0 }

# ── Mesh children parented to character controller entities ────────────────
[parent_transform]
"9"  = { parent = 1 }
"10" = { parent = 2 }
"11" = { parent = 3 }
"12" = { parent = 4 }
"13" = { parent = 5 }
"14" = { parent = 6 }
"15" = { parent = 7 }
"16" = { parent = 8 }

# ── Meshes ─────────────────────────────────────────────────────────────────
[meshes]
"9"  = { model = "knight",    visible = true }
"10" = { model = "barbarian", visible = true }
"11" = { model = "mage",      visible = true }
"12" = { model = "rogue",     visible = true }
"13" = { model = "knight",    visible = true }
"14" = { model = "barbarian", visible = true }
"15" = { model = "mage",      visible = true }
"16" = { model = "rogue",     visible = true }

# ── Animations (clip 6 = idle in general rig) ─────────────────────────────
[animations]
"9"  = { asset = "general", playing = true, clip = 6, speed = 1.0 }
"10" = { asset = "general", playing = true, clip = 6, speed = 1.0 }
"11" = { asset = "general", playing = true, clip = 6, speed = 1.0 }
"12" = { asset = "general", playing = true, clip = 6, speed = 1.0 }
"13" = { asset = "general", playing = true, clip = 6, speed = 1.0 }
"14" = { asset = "general", playing = true, clip = 6, speed = 1.0 }
"15" = { asset = "general", playing = true, clip = 6, speed = 1.0 }
"16" = { asset = "general", playing = true, clip = 6, speed = 1.0 }

# ── Physics ────────────────────────────────────────────────────────────────
[velocities]
"1" = { value = [0.0, 0.0] }
"2" = { value = [0.0, 0.0] }
"3" = { value = [0.0, 0.0] }
"4" = { value = [0.0, 0.0] }
"5" = { value = [0.0, 0.0] }
"6" = { value = [0.0, 0.0] }
"7" = { value = [0.0, 0.0] }
"8" = { value = [0.0, 0.0] }

[rigid_bodies]
"1" = { use_gravity = true }
"2" = { use_gravity = true }
"3" = { use_gravity = true }
"4" = { use_gravity = true }
"5" = { use_gravity = true }
"6" = { use_gravity = true }
"7" = { use_gravity = true }
"8" = { use_gravity = true }

[character_controllers]
"1" = { move_speed = 5.0, jump_speed = 8.5 }
"2" = { move_speed = 5.0, jump_speed = 8.5 }
"3" = { move_speed = 5.0, jump_speed = 8.5 }
"4" = { move_speed = 5.0, jump_speed = 8.5 }
"5" = { move_speed = 5.0, jump_speed = 8.5 }
"6" = { move_speed = 5.0, jump_speed = 8.5 }
"7" = { move_speed = 5.0, jump_speed = 8.5 }
"8" = { move_speed = 5.0, jump_speed = 8.5 }

[health]
"1" = { current = 100.0, max = 100.0 }
"2" = { current = 100.0, max = 100.0 }
"3" = { current = 100.0, max = 100.0 }
"4" = { current = 100.0, max = 100.0 }
"5" = { current = 100.0, max = 100.0 }
"6" = { current = 100.0, max = 100.0 }
"7" = { current = 100.0, max = 100.0 }
"8" = { current = 100.0, max = 100.0 }

[capsule_colliders]
"1" = { radius = 0.38, half_height = 0.46 }
"2" = { radius = 0.38, half_height = 0.46 }
"3" = { radius = 0.38, half_height = 0.46 }
"4" = { radius = 0.38, half_height = 0.46 }
"5" = { radius = 0.38, half_height = 0.46 }
"6" = { radius = 0.38, half_height = 0.46 }
"7" = { radius = 0.38, half_height = 0.46 }
"8" = { radius = 0.38, half_height = 0.46 }

# ── Floor (invisible, physics only) ───────────────────────────────────────
[box_colliders]
"17" = { type = "box", half_extents = [25.0, 0.2, 25.0] }

# ── Autonomous bot behaviors ───────────────────────────────────────────────
[bots]
"1" = { behavior = "walk_forward" }
"2" = { behavior = "patrol",       phase = 0.0 }
"3" = { behavior = "circle",       phase = 0.0 }
"4" = { behavior = "circle",       phase = 1.5707963 }
"5" = { behavior = "walk_forward" }
"6" = { behavior = "patrol",       phase = 3.1415926 }
"7" = { behavior = "circle",       phase = 3.1415926 }
"8" = { behavior = "circle",       phase = 4.7123889 }

# ── Trigger zones ──────────────────────────────────────────────────────────
[triggers]
"18" = { type = "zone", target = 1, radius = 2.0 }
"19" = { type = "zone", target = 2, radius = 2.0 }
"20" = { type = "zone", target = 3, radius = 2.0 }
"21" = { type = "zone", target = 4, radius = 2.0 }
"22" = { type = "zone", target = 5, radius = 2.0 }
"23" = { type = "zone", target = 6, radius = 2.0 }
"24" = { type = "zone", target = 7, radius = 2.0 }
"25" = { type = "zone", target = 8, radius = 2.0 }

# ── Camera entity ──────────────────────────────────────────────────────────
[cameras]
"0" = { fov = 45.0, near = 0.1, far = 100.0, target = [0.0, 0.0, 1.5], up = [0.0, 1.0, 0.0] }
